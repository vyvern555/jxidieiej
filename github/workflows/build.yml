name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q AIPhotoEnhancer_step5.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - run: gradle assembleDebug --no-daemon
        working-directory: AIPhotoEnhancer_fixsrc
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: AIPhotoEnhancer_fixsrc/app/build/outputs/apk/debug/app-debug.apk
